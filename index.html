<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стилі для ігрового модуля */
        #gameCanvas { position: absolute; inset: 0; display: block; z-index: 5; }
        #stars { position: absolute; inset: 0; z-index: 1; }
        #flash { position: absolute; inset: 0; z-index: 20; background: rgba(255,0,0,0.2); opacity: 0; pointer-events: none; transition: opacity 0.1s; }
        #flash.active { opacity: 1; }
        .game-screen {
            position: absolute; inset: 0; z-index: 30;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden bg-black text-white">

    <nav class="bg-black/80 backdrop-blur-xl border-b border-cyan-900/50 fixed w-full z-50 top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex-shrink-0 flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full border-2 border-cyan-400 shadow-[0_0_15px_#22d3ee]"></div>
                    <span class="font-sci-fi font-bold text-xl tracking-[0.2em] text-cyan-400">SOLAR_OS</span>
                </div>
                <div class="hidden md:flex items-center space-x-8 font-sci-fi text-sm tracking-widest">
                    <a href="#scene-container" class="text-gray-400 hover:text-cyan-300">СИСТЕМА</a>
                    <a href="#game-view" class="text-gray-400 hover:text-cyan-300">ГРА</a>
                    <a href="#catalog-view" class="text-cyan-400 border-b-2 border-cyan-400 pb-1">НЕБЕСНІ ТІЛА</a>
                </div>
                <div class="hidden md:flex items-center gap-2">
                    <input type="text" id="username-input" placeholder="ВВЕДІТЬ ІМ'Я..." class="bg-gray-900/50 border border-cyan-900 text-cyan-400 text-xs px-3 py-1 rounded w-40">
                    <button id="greet-btn" class="font-sci-fi text-xs text-black bg-cyan-500 px-3 py-1 rounded">ВХІД</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="mt-20 w-full flex-grow">
        <section id="scene-container" class="w-full h-[85vh] bg-black overflow-hidden relative border-b border-cyan-900/50">
            <div id="universe" class="absolute top-1/2 left-1/2 w-0 h-0 preserve-3d"></div>
        </section>

        <section id="catalog-view" class="max-w-7xl mx-auto px-4 py-16">
            <div class="flex items-center gap-4 mb-8">
                <div class="h-8 w-1 bg-cyan-500 shadow-[0_0_10px_#06b6d4]"></div>
                <h3 class="font-sci-fi text-2xl text-white tracking-widest uppercase">Небесні тіла</h3>
            </div>
            <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                </div>
        </section>

        <section id="game-view" class="w-full bg-gray-950 border-t border-cyan-900/30 py-20">
            <div class="max-w-5xl mx-auto px-4 text-center">
                <div class="flex justify-center items-center gap-4 mb-12">
                    <div class="h-1 w-16 bg-cyan-500 shadow-[0_0_15px_#06b6d4]"></div>
                    <h3 class="font-sci-fi text-4xl text-white tracking-[0.4em]">ROCKET VOYAGE</h3>
                    <div class="h-1 w-16 bg-cyan-500 shadow-[0_0_15px_#06b6d4]"></div>
                </div>

                <div id="game-container" class="relative bg-black border-2 border-cyan-900/50 rounded-2xl overflow-hidden h-[550px] shadow-[0_0_50px_rgba(6,182,212,0.1)]">
                    <canvas id="stars"></canvas>
                    <canvas id="gameCanvas"></canvas>
                    <div id="flash"></div>

                    <div id="hud" class="absolute top-0 left-0 right-0 z-10 flex justify-between p-6 font-sci-fi text-cyan-400" style="display:none">
                        <div class="flex items-center gap-2">
                            <span class="text-xs opacity-50">STATUS:</span>
                            <span id="scoreDisplay">0000</span>
                        </div>
                        <div id="livesDisplay" class="text-xl">❤️❤️❤️</div>
                    </div>

                    <div id="startScreen" class="game-screen">
                        <div class="mb-6">
                            <span class="text-6xl animate-pulse">🚀</span>
                        </div>
                        <h4 class="font-sci-fi text-2xl text-cyan-400 tracking-[0.3em] mb-8">БОРТОВИЙ МОДУЛЬ ГОТОВИЙ</h4>
                        <div class="grid grid-cols-2 gap-8 text-left mb-10 font-mono text-[11px] text-gray-400 tracking-wider">
                            <div>[ WASD ] — РУХ</div>
                            <div>[ TOUCH ] — ЖЕСТИ</div>
                            <div>[ SCORE ] — ВИЖИВАННЯ</div>
                            <div>[ LIFE ] — 3 ОДИНИЦІ</div>
                        </div>
                        <button id="startBtn" class="font-sci-fi text-xs text-black bg-cyan-500 px-10 py-4 rounded-full hover:bg-cyan-300 transition-all transform hover:scale-105 shadow-[0_0_30px_#06b6d4]">
                            ІНІЦІАЛІЗУВАТИ ПОЛІТ
                        </button>
                    </div>

                    <div id="gameOverScreen" class="game-screen hidden">
                        <h4 class="font-sci-fi text-3xl text-red-500 mb-2">ЗВ'ЯЗОК ВТРАЧЕНО</h4>
                        <div class="text-5xl font-sci-fi text-white mb-6" id="finalScore">0</div>
                        <button id="restartBtn" class="font-sci-fi text-xs text-black bg-cyan-500 px-8 py-3 rounded-full hover:bg-cyan-400 transition">
                            СИСТЕМНИЙ ПЕРЕЗАПУСК
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="py-12 bg-black border-t border-cyan-900/50 text-center font-sci-fi">
        <div class="max-w-7xl mx-auto px-4 flex flex-col items-center gap-4">
            <p class="text-cyan-500 text-sm tracking-[0.3em]">&copy; 2026 SOLAR_OS SYSTEM</p>
            <p class="text-[10px] text-gray-600 uppercase tracking-widest">Проект створено командою розробників</p>
        </div>
    </footer>

    <script src="solar-system.js"></script>
    <script src="script.js"></script>
    <script src="game.js"></script>
</body>
</html>
