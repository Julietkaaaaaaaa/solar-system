<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLAR_OS — Explore Universe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стилі для відповідності скриншотам */
        .font-sci-fi { font-family: 'Orbitron', sans-serif; }
        
        /* Ефект неонової кнопки */
        .btn-neon {
            background: #00bcd4;
            box-shadow: 0 0 20px rgba(0, 188, 212, 0.5);
            transition: 0.3s ease;
        }
        .btn-neon:hover {
            background: #00e5ff;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.8);
            transform: scale(1.05);
        }

        /* Чорний фон для гри як на макеті */
        #game-view-container {
            background: #050a14;
            border: 1px solid #1a2a3a;
            position: relative;
            min-height: 500px;
        }

        /* Тонка рамка для карток інструкцій */
        .instruction-card {
            background: rgba(0, 20, 30, 0.4);
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-radius: 12px;
        }
    </style>
</head>
<body class="bg-[#020617] text-white min-h-screen overflow-x-hidden">

    <nav class="bg-black/90 backdrop-blur-md border-b border-cyan-900/30 fixed w-full z-50 top-0">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex items-center justify-between h-20">
                
                <div class="flex items-center gap-3">
                    <div class="w-7 h-7 rounded-full border-2 border-cyan-400 shadow-[0_0_10px_#22d3ee]"></div>
                    <span class="font-sci-fi font-black text-xl tracking-[0.2em] text-cyan-400">SOLAR_OS</span>
                </div>

                <div class="hidden md:flex items-center space-x-10 font-sci-fi text-[11px] tracking-[0.25em]">
                    <a href="#scene-container" class="text-gray-400 hover:text-cyan-300 transition uppercase">Система</a>
                    <a href="#game-view" class="text-gray-400 hover:text-cyan-300 transition uppercase">Гра</a>
                    <a href="#catalog-view" class="text-cyan-400 border-b border-cyan-400 pb-1 uppercase">Небесні тіла</a>
                </div>

                <div class="hidden md:flex items-center gap-3">
                    <input type="text" placeholder="ВВЕДІТЬ ІМ'Я..." 
                           class="bg-gray-900/60 border border-cyan-900/50 text-cyan-400 text-[10px] font-sci-fi px-4 py-2 rounded focus:outline-none focus:border-cyan-400 transition w-44">
                    <button class="font-sci-fi text-[10px] font-bold text-black bg-cyan-500 px-6 py-2 rounded hover:bg-cyan-400 transition uppercase tracking-widest">
                        Вхід
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="mt-20">
        <section id="scene-container" class="w-full h-[80vh] relative bg-black border-b border-cyan-900/20">
            <div id="universe" class="absolute inset-0"></div>
            <div class="absolute bottom-10 w-full text-center text-cyan-500/40 font-sci-fi text-[10px] tracking-[0.3em]">
                [ ТЯГНІТЬ МИШКОЮ ДЛЯ ОБЕРТАННЯ • CTRL + СКРОЛ ДЛЯ МАСШТАБУВАННЯ ]
            </div>
        </section>

        <section id="catalog-view" class="max-w-7xl mx-auto px-6 py-20">
            <div class="flex items-center gap-4 mb-12">
                <div class="h-10 w-1.5 bg-cyan-500 shadow-[0_0_15px_#06b6d4]"></div>
                <h2 class="font-sci-fi text-3xl font-bold tracking-tighter uppercase">Небесні тіла</h2>
                <div class="ml-auto relative">
                     <input type="text" placeholder="ПОШУК ОБ'ЄКТА..." class="bg-transparent border border-cyan-900/50 text-cyan-300 text-xs font-sci-fi px-10 py-2.5 rounded w-64">
                     <span class="absolute left-3 top-2.5 opacity-40">🔍</span>
                </div>
            </div>
            
            <div class="flex gap-4 mb-10 overflow-x-auto pb-4">
                <button class="font-sci-fi text-[10px] px-6 py-2 rounded border border-cyan-500 bg-cyan-950/30 text-cyan-400 tracking-widest">ВСІ</button>
                <button class="font-sci-fi text-[10px] px-6 py-2 rounded border border-gray-800 text-gray-500 tracking-widest hover:border-cyan-800 transition">ПЛАНЕТИ</button>
                <button class="font-sci-fi text-[10px] px-6 py-2 rounded border border-gray-800 text-gray-500 tracking-widest">ЗІРКИ</button>
            </div>

            <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                </div>
        </section>

        <section id="game-view" class="w-full py-20 bg-black">
            <div class="max-w-5xl mx-auto px-6 text-center">
                <div class="flex justify-center items-center gap-6 mb-12">
                    <div class="h-[2px] w-16 bg-cyan-500/50"></div>
                    <h2 class="font-sci-fi text-4xl font-black tracking-[0.4em]">ГРА</h2>
                    <div class="h-[2px] w-16 bg-cyan-500/50"></div>
                </div>

                <div id="game-view-container" class="rounded-3xl flex flex-col items-center justify-center p-12">
                    <h3 class="font-sci-fi text-6xl font-black text-cyan-400 tracking-[0.2em] mb-2 shadow-cyan-500/20">SOLAR_OS</h3>
                    <p class="font-sci-fi text-[10px] text-cyan-500/60 tracking-[0.5em] mb-12">// ROCKET SURVIVAL v2.0 //</p>

                    <div class="instruction-card p-8 w-full max-w-md text-left mb-12">
                        <div class="flex items-center gap-3 mb-6">
                            <span>🚀</span>
                            <span class="font-sci-fi text-sm font-bold uppercase tracking-widest">Керуй ракетою</span>
                        </div>
                        <ul class="space-y-4 text-[12px] text-gray-400 font-medium">
                            <li class="flex items-center gap-4">⌨️ <span class="tracking-wide">WASD / Стрілки — рух</span></li>
                            <li class="flex items-center gap-4">☄️ <span class="tracking-wide">Уникай комет та НЛО</span></li>
                            <li class="flex items-center gap-4">⚡ <span class="tracking-wide">Швидкість зростає!</span></li>
                        </ul>
                    </div>

                    <button id="startBtn" class="btn-neon font-sci-fi text-xs font-black text-black px-16 py-4 rounded-full tracking-[0.2em] uppercase">
                        Ініціалізувати
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer class="py-12 bg-black border-t border-cyan-900/20 text-center">
        <p class="font-sci-fi text-[10px] text-cyan-600 tracking-[0.3em]">&copy; 2026 SOLAR_OS SYSTEM</p>
    </footer>

    <script src="solar-system.js"></script>
    <script src="script.js"></script>
    <script src="game.js"></script>
</body>
</html>
